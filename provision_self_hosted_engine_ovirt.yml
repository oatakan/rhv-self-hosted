---

- hosts: all
  become: yes
  vars_files:
    - vars/rhel_{{ ansible_distribution_major_version }}.yml
    - vars/engine.yml
  tasks:
    - block:
        - name: register with RHN
          include_role:
            name: oatakan.rhn
          vars:
            repo_channels: "{{ repos.rhv_engine }}"
          when: ansible_distribution == 'RedHat'

        # this is needed temporarily until ovirt-engine package is updated
        - name: exclude ansible-2.9.19*,ansible-2.9.20*,ansible-2.9.21*,ansible-2.9.22*
          lineinfile:
            path: /etc/yum.conf
            create: yes
            line: 'exclude=ansible-2.9.19*,ansible-2.9.20*,ansible-2.9.21*,ansible-2.9.22*'
            state: present
          when: ansible_distribution == 'RedHat'

        - name: set ansible password
          set_fact:
            ansible_password: "{{ ansible_password | default('') }}"
          no_log: true

        - name: gather package facts for oVirt update guard
          package_facts:
          when: ansible_distribution_major_version|int >= 10

        - name: set installed oVirt package guard facts
          set_fact:
            rhv_ovirt_guard_packages_installed: >-
              {{
                ansible_facts.packages | default({}) | dict2items |
                map(attribute='key') |
                select('match', rhv_ovirt_package_guard_regex) |
                list | sort
              }}
          when: ansible_distribution_major_version|int >= 10

        - name: run pre-oVirt OS upgrade
          include_role:
            name: oatakan.rhel_upgrade
          vars:
            update_reboot_kernel: true
          when:
            - rhv_pre_ovirt_upgrade_enabled | default(false) | bool
            - rhv_ovirt_guard_packages_installed | default([]) | length == 0

        - name: skip pre-oVirt OS upgrade after oVirt packages are installed
          debug:
            msg:
              - "Skipping pre-oVirt OS upgrade because oVirt-managed packages are already installed."
              - "Installed guarded packages: {{ rhv_ovirt_guard_packages_installed }}"
          when:
            - rhv_pre_ovirt_upgrade_enabled | default(false) | bool
            - rhv_ovirt_guard_packages_installed | default([]) | length > 0

        - name: use engine setup offline mode for guarded EL10 stable reruns
          set_fact:
            ovirt_engine_setup_offline: true
          when:
            - ansible_distribution_major_version|int >= 10
            - ovirt_repo_track | default('stable') == 'stable'
            - rhv_ovirt_guard_packages_installed | default([]) | length > 0

        - include_role:
            name: "{{ role_name }}"
          loop_control:
            loop_var: role_name
          loop:
            - hosts-file
            - common
            - ovirt.ovirt.engine_setup
            - ovirt-engine-config
            - ovirt-host-vdsm-hooks
            - oatakan.rhel_gpu_passthrough
            - edk2
            - ovirt-post-install

      always:
        - include_role:
            name: oatakan.rhn
          vars:
            role_action: unregister
          when:
            - ansible_distribution == 'RedHat'
            - not (rhn_offline | default(false)) | bool
